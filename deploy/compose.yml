# Run from the server: ~/apps/money-motion-app/src/deploy/compose.yml
# Paths below are relative to this file: ../../data and ../../env live
# alongside src/ in ~/apps/money-motion-app/, outside the deployed tree.
name: money-motion

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: money-motion-app
    # run as marc (uid 1000), not root: files created on the data mount stay owned by marc
    user: "1000:1000"
    restart: unless-stopped
    ports:
      # published on the LAN so phones can reach it directly
      # (3000 = net-worth-app, 3002 = option-pilot-app)
      - "${MM_PORT:-3003}:3000"
    environment:
      # pinned here, not in the env file: the app must only ever see the mounted DB
      DATABASE_URL: "file:/app/data/money-motion.sqlite?connection_limit=1"
    env_file:
      - ../../env
    volumes:
      - ../../data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s

  # one-off schema sync, run by deploy.sh before each `up`:
  #   docker compose -f deploy/compose.yml run --rm migrate
  # profiles: keeps it from starting with `up -d`
  migrate:
    profiles: ["tools"]
    user: "1000:1000"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: builder
    environment:
      DATABASE_URL: "file:/app/data/money-motion.sqlite?connection_limit=1"
    volumes:
      - ../../data:/app/data
    command: npx prisma db push --skip-generate
